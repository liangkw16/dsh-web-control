name: Feature request / 功能建议
description: Describe the workflow and desired outcome.
body:
  - type: textarea
    id: problem
    attributes:
      label: What workflow is currently difficult?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior and stock DSH capability to reuse
    validations:
      required: true
